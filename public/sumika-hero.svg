<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111827; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b; stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGradient)" />

  <g transform="translate(600, 315)">
    <!-- Icon -->
    <g transform="translate(0, -110) scale(1.8) translate(-60, -40) rotate(-15 60 40)">
      <!-- Vertical Bar (Sumika) -->
      <rect x="52" y="0" width="16" height="80" fill="#94a3b8" rx="4" />
      <!-- Horizontal Line (Threshold) -->
      <g stroke="#94a3b8" stroke-width="6" stroke-linecap="round">
        <path d="M 0 40 L 40 40" />
        <path d="M 80 40 L 120 40" />
      </g>
    </g>
    
    <!-- Text -->
    <text y="80" text-anchor="middle" style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 96px; font-weight: 600; fill: #e2e8f0;">
      Sumika
    </text>
    <text y="140" text-anchor="middle" style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 400; fill: #94a3b8;">
      The home for your agents.
    </text>
  </g>
</svg>
